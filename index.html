    <script type="text/babel">
        // Polyfill for window.storage to mimic async localStorage
        window.storage = {
            get: async (key) => {
                const value = localStorage.getItem(key);
                return value ? { value } : null;
            },
            set: async (key, value) => {
                localStorage.setItem(key, value);

        };

        // Paste the JSX content here
        const { useState, useEffect, useCallback, useRef } = React;

        const QUESTS = [
          { num: 1, act: "ACT I", actName: "THE SUMMONING", title: "The Summoning of the Holy Priest", code: "LFGRAID", difficulty: "Mandatory", xp: 100, perk: null, flavor: "Stäng ner det du gör. Spara inte. Det spelar ingen roll längre.", body: "I exakt 12,636 dagar har du levt ditt liv som om inget väntade. Du har gått till jobbet. Du har ätit lunch. Du har svarat på mail som ingen bryr sig om. Allt medan 'The Eternal Bond' närmar sig - den mäktigaste ritualen en Priest som du kan genomgå. Bindandet av din själ till en annan. Permanent. Ingen Dispel. Ingen ragequit.\n\nVi - din GUILD har sett på från avstånd. Men vi har nu beslutat att du är inte redo. Inte än.\n\nDärför har vi samlats här idag. Vi är ditt party - och detta är din sista kampanj. En serie prövningar genom [***REDACTED***], designade för att testa om du verkligen är värdig 'The Eternal Bond'.", objective: "Drick upp. Se upp. All abord the hypetrain.", rules: ["Du får INTE veta vart vi ska eller vad vi ska göra", "Du får INTE kontakta Jonna förrän partyt ger dig clearance", "Du följer Raid Leaders instruktioner utan ifrågasättande", "Bryter du reglerna: −500 XP"], quote: "Every hero's journey begins with leaving the Auction House." },
          { num: 2, act: "ACT I", actName: "THE SUMMONING", title: "Through the Portal", code: "BUFFPLS", difficulty: "Moderate", xp: 50, perk: "PRIEST'S BLESSING — Peka på valfri partymedlem och säg 'Blessing of the Priest.' Den personen MÅSTE följa med och hjälpa dig bära. Denna perk gäller endast innan portalen öppnas.", flavor: "Portalen surrar av uråldrig magi. På andra sidan väntar ett land av prövningar. Det finns ingen Hearthstone tillbaka.", body: "Vi kan inte berätta vart portalen leder - det strider mot Guild Protocol sektion 4, paragraf 32: \"du får inte veta\". Det vi KAN säga: på andra sidan finns en server du inte kontrollerar och prövningar som kräver mer av dig än att flame:a noobs i chatten. Nej, här krävs det att du steppar upp till och bevisar att du är värdig ditt destiny.\n\nEn healer som inte buffar sitt party är en healer som wipar sitt party. Innan portalen öppnas har du en helig plikt.", objective: "Förse ditt party med provisions (DRYCK OCH SNACKS) inför resan. En Priest som inte sörjer för sitt party förtjänar inte sin titel.", rules: ["Du betalar givetvis, medveten om att vi har lagt ut fett med deg på detta"], quote: "Loading screen tips: Om du inte vet vart du ska, följ tanken." },
          { num: 3, act: "ACT I", actName: "THE SUMMONING", title: "The Inn", code: "RESTED", difficulty: "Trivial (enjoy it while it lasts)", xp: 50, perk: "HEALER PRIVILEGE — Du får önska vem du vill sova med. Men om din kärleksförklaring inte blir besvarad får du -1400 XP i \"Reputation\".", flavor: "Du har klivit genom portalen. Du lever. Det är troligen en bra start.", body: "Runt dig breder ett nytt land ut sig. Lukterna är annorlunda. Språket nästan begripligt. Valutan suspekt. Men ditt party har säkrat ett värdshus och bas för kampanjens kommande prövningar.\n\nNjut av lugnet. Det varar inte. Ikväll väntar din första prövning, och den kräver att du är utvilad, påklädd, och mentalt förberedd för saker du inte kan föreställa dig.", objective: "Checka in. Orientera dig. Förbered dig för kvällen.", rules: ["Inga smygsamtal till Jonna", "Raid Leader utser tid och plats för guildens återsamlande. Kom i tid!"], quote: "Inn music playing. You feel rested. Your XP bar glows faintly." },
          { num: 4, act: "ACT I", actName: "THE SUMMONING", title: "Reinforcements from the Eastern Kingdoms", code: "LFGMORE", difficulty: "Emotional", xp: 150, perk: null, flavor: "Minns du party-rostern? Minns du de tomma platserna?", body: "Hunter: \"Ej lokaliserad. Signal förlorad.\" Shaman: \"Ej lokaliserad. Signal förlorad.\"\n\nVi ljög inte. Deras signal VAR förlorad. De befann sig i andra delar av riket, långt bortom räckhåll. Vi visste inte om de skulle hinna. Vi visste inte om portalen skulle hålla.\n\nMen den höll.\n\nDe är här nu. Din Hunter och din Shaman. De korsade länder och tidszoner för att stå vid din sida i kampanjens avgörande fas. Ditt party är nu vid FULL STRENGTH — och det är precis vad du kommer att behöva.", objective: "Välkomna dina förlorade allierade med en proper Guild Greeting: en gruppshot, alla nio.", rules: ["Raid difficulty ökar. Partyt är komplett."], quote: "LFG complete. Nine souls. One destiny. Zero excuses." },
          { num: 5, act: "ACT I", actName: "THE SUMMONING", title: "The Feast of Gods", code: "WARPIGS", difficulty: "Hard", xp: 150, perk: "+150 XP Om du även berättar hur du känner alla i partyt eftersom detta är första gången vi ses lol", flavor: "Gudarna ler mot oss och blessar oss med kött och kall öl.", body: "Ditt party eskorterar dig till en grand hall. Vi kan inte avslöja dess namn, det kommer tala för sig självt när dörrarna öppnas.\n\nMen mitt i festens kaos har du en uppgift som ingen healing kan rädda dig från.", objective: "Du ska, inför ditt samlade party, berätta om den person du valt att binda din själ till. Inte 'jag älskar Jonna för att hon är snäll' — det kan en NPC säga. Berätta och utelämna inget!", rules: ["+50 XP om partyt höjer sina bägare och ropar WORTHY", "−25 XP varje gång du kollar mobilen under kvällen"], quote: "Leeroy Jenkins drog aldrig in i en feast oförberedd. Okej, det gjorde han. Men du är bättre än Leeroy." },
          { num: 6, act: "ACT I", actName: "THE SUMMONING", title: "A Dark Presence Approaches", code: "SUMMON", difficulty: "Unpredictable", xp: 100, perk: "☠️ TOASTMASTER'S CURSE — Warlock Christian har ETT uppdrag/dare som kan komma när som helst. Du kan inte neka. Du kan inte Dispela. Du kan inte Fade.", flavor: "Du kände det, eller hur? Temperaturen sjönk. Ölskummet vibrerade i ditt glas som en seismograf för incoming doom.", body: "Och sen - stegen. Tunga steg. De klapprande spanska höfterna.\n\nEn Warlock har anslutit sig till ditt party.\n\nWarlocks är opålitliga, och har en tendens att sacrificea partymedlemmar för personlig vinning. MEN - denna Warlock kommer med en titel: Toastmaster. Hans makt är specifik, begränsad, och exakt lika skrämmande som det låter.", objective: "Välkomna din nya allierade. Hela partyt ska skåla - en välkomstshot krävs av samtliga. Det är Guild Protocol.", rules: [], quote: "You hear a faint whisper: 'I have candy.' You should not follow the Warlock. You will anyway." },
          { num: 7, act: "ACT II", actName: "THE TRIALS", title: "The Morning Resurrection", code: "REZPLZ", difficulty: "Depends on last night", xp: 50, perk: null, flavor: "Solen stiger. Din mana bar är tom. Din health bar flimrar i rött.", body: "Det finns en ironisk skönhet i det här: du, en HEALER, som inte kan heala dig själv. Hela din karriär har du stått bakom andra och hållit dem vid liv. Du har kastat Renew på Warriors som rushat in utan plan. Du har desperatcastat Flash Heal på Mages som stått i AoE:n IGEN.\n\nOch nu ligger du här. I en säng du knappt minns att du la dig i. Med en smak i munnen som antyder att du åt något som inte borde existera.\n\nMen en Priest faller inte. En Priest RESER SIG.", objective: "Res dig. Hitta frukost. Överlev den.", rules: ["+25 XP om du är FÖRST upp och väcker resten av partyt"], quote: "You are not prepared. — Illidan, som aldrig behövde hantera en hotellfrukost med hangover." },
          { num: 8, act: "ACT II", actName: "THE TRIALS", title: "The Trial of the Unknown", code: "SHADOW", difficulty: "[REDACTED]", xp: 200, perk: null, flavor: "Du har healat. Du har buffat. Du har stått i bakre raden. Idag blir du DPS.", body: "Det är dags för din första raid. Den kommer kräva både strategi, ledarskap, våld och en hel del tur.", objective: "Genomför alla prövningarna. Detaljer avslöjas on site. Lita på din Raid Leader.", rules: ["Bonusar och straff avslöjas on site"], quote: "Switching spec from Holy to Shadow. Please wait... please wait..." },
          { num: 9, act: "ACT II", actName: "THE TRIALS", title: "The Market of a Thousand Flavors", code: "OMNOM", difficulty: "Medium (your stomach may disagree)", xp: 100, perk: null, flavor: "Lukterna blandas med havsvind. Röster ropar på språk du inte förstår. Eld flammar från riktningar du inte förväntar sig.", body: "Din quest har fört dig till en handelskvarterszon — ett Merchant Quarter — där mästare från jordens alla hörn samlats för att erbjuda saker din mage aldrig bett om men ditt hjärta inte kan motstå.\n\nDet här är en quest om TILLIT. Du har tillbringat hela ditt liv med att välja tryggt. Healers gör det — ni väljer det säkra, det beprövade. Men ibland, Priest, måste du välja det okända.", objective: "Free-for-all", rules: [], quote: "Cooking skill increased to 376. But at what cost?" },
          { num: 10, act: "ACT II", actName: "THE TRIALS", title: "The Final Feast Before the Eternal Bond", code: "BONFIRE", difficulty: "Legendary", xp: 300, perk: "🔥 PRIEST'S LAST COMMAND — Du får ge ETT uppdrag till valfri partymedlem. Vad som helst. Ikväll.", flavor: "Det här är det, Priest. Din sista kväll som obunden.", body: "Imorgon börjar resan hem, och efter det — The Eternal Bond. Jonna väntar. Resten av ditt liv väntar.\n\nMen ikväll sitter du vid ett bord med åtta människor som reste till ett annat land för att fira DIG. Åtta helt separata liv med egna jobb, egna planer, egna problem. Och de valde att vara HÄR. Med DIG.\n\nDet är inte \"kul med grabbarna.\" Det är ett guild som säger: du betyder något för oss. På riktigt.", objective: "Enjoy!", rules: ["-Varje skål MÅSTE avslutas med antingen For the horde eller For Jonna!", "+25 XP Om du håller tal till en partymedlem", "+25 XP om du blir synbart rörd"], quote: "For the Horde. For the Alliance. For Jonna." },
          { num: 11, act: "ACT III", actName: "THE RETURN", title: "Hearthstone", code: "GG", difficulty: "Bittersweet", xp: 0, perk: null, flavor: "Du har klarat det.", body: "Tre akter. Elva quests. Hundratals XP. Minnen som inte går att Dispela.\n\nKampanjen är slut. Du sov dåligt, du åt för mycket, du drack saker som förmodligen inte var lagliga i ditt hemland, och du har haft det bästa du haft sedan... ja. Sedan sist vi alla var samlade (aldrig).\n\nNu trycker du på Hearthstone. Du reser hem. Till ditt vanliga liv — fast ingenting är vanligt längre. Jonna väntar. The Eternal Bond väntar.", objective: "Packa ihop. Checka ut. Lämna inget bakom dig — varken i rummet eller i ditt hjärta.", rules: [], quote: "You have been disconnected from the server. Reason: real life is calling." },
        ];

        const SIDE_QUESTS = [
          { id: "sq1", unlocksAtLevel: 2, type: "CHALLENGE", title: "First Blood", description: "Beställ en dryck utan att kolla menyn. Peka och säg 'that one'. Ingen ånger.", xp: 25, code: "YOLO" },
          { id: "sq2", unlocksAtLevel: 3, type: "GUILD RULE", title: "Decree of the Disciple", description: "Du får införa EN regel som gäller hela guildet i 30 minuter. Regeln kan inte innebära att någon måste spendera pengar.", xp: 50, code: "MYLAW" },
          { id: "sq3", unlocksAtLevel: 3, type: "GRIND", title: "Reputation Grind: Jonna", description: "Skicka ett meddelande till Jonna som innehåller orden 'eternal bond' utan att förklara varför. Screenshotta hennes svar.", xp: 50, code: "JONNA1" },
          { id: "sq4", unlocksAtLevel: 4, type: "CHALLENGE", title: "Battlecry", description: "Gå fram till en främling och säg 'For The Horde' med full conviction. Bonuspoäng om de svarar.", xp: 50, code: "LOK" },
          { id: "sq5", unlocksAtLevel: 5, type: "GRIND", title: "Potion Master", description: "Drick tre olika shots under kvällen. En av varje färg: ljus, mörk, och 'varför finns detta'. Rapportera till Raid Leader.", xp: 50, code: "3SHOTS" },
          { id: "sq6", unlocksAtLevel: 5, type: "CHALLENGE", title: "Blurred memories of Destiny", description: "Ta en selfie med valfri partymedlem. Båda måste göra sitt bästa 'epic raid victory'-ansikte.", xp: 25, code: "SELFIE" },
          { id: "sq7", unlocksAtLevel: 6, type: "GUILD RULE", title: "Archon's Mandate", description: "Välj en partymedlem. Den personen måste hämta dryck/mat åt dig nästa gång gruppen beställer. Ingen förhandling.", xp: 25, code: "FETCH" },
          { id: "sq8", unlocksAtLevel: 7, type: "GRIND", title: "Bard Mode: Activated", description: "Gå fram till DJ:n och be om att få rappa en 50cent låt. 10.000 XP om du klarar det.", xp: 75, code: "BARD" },
          { id: "sq9", unlocksAtLevel: 8, type: "CHALLENGE", title: "Inspect Element", description: "Ge en ärlig, ofiltrerad compliment till varje partymedlem. Inte 'du är cool' — något specifikt. Alla åtta.", xp: 100, code: "INSPECT" },
          { id: "sq10", unlocksAtLevel: 9, type: "GUILD RULE", title: "Exalted Decree", description: "Du får byta namn på en partymedlem för resten av kvällen. Alla MÅSTE använda det nya namnet.", xp: 50, code: "RENAME" },
        ];

        const LOOT = [
          { sqId: "sq1",  icon: "🍺", name: "Liquid Courage Potion",   desc: "Du bestämmer vad nästa shots-runda ska vara. Hela partyt lyder." },
          { sqId: "sq2",  icon: "📜", name: "Scroll of Domination",     desc: "En guild-regel du kan aktivera en gång senare under kvällen. Ingen kan neka." },
          { sqId: "sq3",  icon: "💌", name: "Jonna's Blessing",         desc: "+50 bonus-XP om Jonna svarar med hjärtan eller förvirrat 'wtf'." },
          { sqId: "sq4",  icon: "🏴", name: "Banner of the Horde",      desc: "Hela partyt måste ropa 'FOR THE HORDE' med dig, en gång, när du väljer." },
          { sqId: "sq5",  icon: "⚗️", name: "Alchemist's Flask",        desc: "Du kan delegera ett shot till valfri partymedlem. De kan inte tacka nej." },
          { sqId: "sq6",  icon: "📸", name: "Amulet of Memories",       desc: "Fotot postas permanent i guild-chatten. Inget tas bort. Evigt." },
          { sqId: "sq7",  icon: "💍", name: "Ring of Command",          desc: "Valfri partymedlem är din personliga butler i 5 minuter. Full lydnad." },
          { sqId: "sq8",  icon: "🎸", name: "Lute of Legends",          desc: "Välj en låt som hela partyt MÅSTE sjunga med på. Ingen undslipper." },
          { sqId: "sq9",  icon: "👁️", name: "Eye of the Beholder",     desc: "Valfri partymedlem MÅSTE ge dig en ärlig komplimang, direkt, inför alla." },
          { sqId: "sq10", icon: "👑", name: "Crown of the Exalted",     desc: "Välj ett nytt titel/smeknamn för dig själv som alla MÅSTE använda resten av kvällen." },
        ];

        const LEVELS = [
          { level: 1, title: "Acolyte", xp: 0 },
          { level: 2, title: "Novice Priest", xp: 100 },
          { level: 3, title: "Disciple", xp: 250 },
          { level: 4, title: "Cleric", xp: 400 },

          { level: 8, title: "Ascendant", xp: 1250 },

        const RANKS = [
          { min: 0,    max: 99,    name: "Unworthy",               flavor: "Inte ens din mamma är imponerad." },
          { min: 100,  max: 299,   name: "Barely Tolerated",       flavor: "Guildet accepterar dig. Motvilligt." },
          { min: 300,  max: 549,   name: "Questionably Adequate",  flavor: "Du existerar. Det är en start." },
          { min: 550,  max: 799,   name: "Grudgingly Accepted",    flavor: "Ingen är imponerad. Ännu." },
          { min: 800,  max: 1049,  name: "Almost Decent",          flavor: "Svagt. Men märkbart." },
          { min: 1050, max: 1299,  name: "Shows Promise",          flavor: "Det rör sig... kanske." },
          { min: 1300, max: 1549,  name: "Respectable",            flavor: "Jonna nickar. Osäkert, men ändå." },
          { min: 1550, max: 1799,  name: "Battle-Hardened",        flavor: "Du förtjänar din plats i guildet." },
          { min: 1800, max: 99999, name: "Worthy of Eternal Bond", flavor: "Realm First. Inga ord räcker till." },
        ];
        function getRank(xp) { return RANKS.find(r => xp >= r.min && xp <= r.max) || RANKS[RANKS.length - 1]; }

        const PERKS_DATA = [
          { questNum: 2,  name: "PRIEST'S BLESSING",    desc: "Peka på valfri partymedlem och säg 'Blessing of the Priest.' Den personen MÅSTE följa med och hjälpa dig bära. Denna perk gäller endast innan portalen öppnas.", icon: "🙏" },
          { questNum: 3,  name: "HEALER PRIVILEGE",      desc: "Du får önska vem du vill sova med. Men om din kärleksförklaring inte blir besvarad får du -1400 XP i \"Reputation\".", icon: "🛏️" },
          { questNum: 6,  name: "TOASTMASTER'S CURSE",   desc: "Warlock Christian har ETT uppdrag/dare som kan komma när som helst. Du kan inte neka. Du kan inte Dispela. Du kan inte Fade.", icon: "☠️" },
          { questNum: 10, name: "PRIEST'S LAST COMMAND", desc: "Du får ge ETT uppdrag till valfri partymedlem. Vad som helst. Ikväll.", icon: "🔥" },
        ];

        const PARTY = [
          { name: "Mauritz", cls: "Holy Priest", icon: "✝️", role: "The one who heals must now be healed", hiddenUntilQuest: null },
          { name: "Gustaf", cls: "Paladin", icon: "⚔️", role: "Raid Leader · Best Man", hiddenUntilQuest: null },
          { name: "Philip", cls: "Rogue", icon: "🗡️", role: "Shadow Operative", hiddenUntilQuest: null },

        ];

        const THEMES = [
          // L1 Acolyte — cold stone, dim silver-purple
          { bg1: "#1a1025", bg2: "#0e0a18", accent: "#a8a0c0", glow: "rgba(168,160,192,0.10)", card: "rgba(22,14,34,0.88)" },
          // L2 Novice Priest — deep purple awakening

          // L3 Disciple — electric indigo, arcane
          { bg1: "#120e30", bg2: "#0a0820", accent: "#7060e8", glow: "rgba(112,96,232,0.18)", card: "rgba(16,10,44,0.88)" },
          // L4 Cleric — blue-purple, disciplined shadow

          // L6 Archon — blood rose, corruption begins

          // L7 Prophet — crimson, blood magic

          // L8 Ascendant — coal black + ember orange

          // L9 Exalted — night + hellfire
          { bg1: "#150508", bg2: "#0a0304", accent: "#f04010", glow: "rgba(240,64,16,0.32)", card: "rgba(20,4,10,0.92)" },
          // L10 Eternal — absolute black + chaos fire

        const SK = "eternal-bond-v2";
        async function load() { try { const r = await window.storage.get(SK); if (r?.value) { const d = JSON.parse(r.value); return { uq: [], csq: [], bxp: 0, gc: false, dx: false, bs: 0, ...d }; } } catch {} return { uq: [], csq: [], bxp: 0, gc: false, dx: false, bs: 0 }; }
        async function save(s) { try { await window.storage.set(SK, JSON.stringify(s)); } catch {} }

        function calcXP(s) {
          const base = s.uq.reduce((a, n) => a + (QUESTS.find(q => q.num === n)?.xp || 0), 0);
          return s.dx ? Math.floor(base * 1.5) : base;
        }
        function getLvl(xp) { return LEVELS.reduce((b, l) => xp >= l.xp ? l : b, LEVELS[0]); }

        function CodeInput({ onOk, code }) {
          const [v, setV] = useState("");
          const [e, setE] = useState(false);
          const MASTER = "GMMODE";
